<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>휴무 취합 시스템</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
  <!-- 로그인/회원가입 -->
  <div id="auth-page" class="page">
    <div class="auth-container">
      <div class="auth-header">
        <i class="ri-calendar-check-line"></i>
        <h1>휴무 취합 시스템</h1>
        <p>팀 휴무 일정을 간편하게 관리하세요</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">로그인</button>
        <button class="auth-tab" data-tab="register">회원가입</button>
      </div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="login-username"><i class="ri-user-line"></i> 아이디</label>
          <input type="text" id="login-username" placeholder="아이디를 입력하세요" required>
        </div>
        <div class="form-group">
          <label for="login-password"><i class="ri-lock-line"></i> 비밀번호</label>
          <input type="password" id="login-password" placeholder="비밀번호를 입력하세요" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">로그인</button>
      </form>

      <form id="register-form" class="auth-form" style="display:none">
        <div class="form-group">
          <label for="reg-name"><i class="ri-user-smile-line"></i> 이름</label>
          <input type="text" id="reg-name" placeholder="실명을 입력하세요" required>
        </div>
        <div class="form-group">
          <label for="reg-username"><i class="ri-user-line"></i> 아이디</label>
          <input type="text" id="reg-username" placeholder="3자 이상" required minlength="3">
        </div>
        <div class="form-group">
          <label for="reg-password"><i class="ri-lock-line"></i> 비밀번호</label>
          <input type="password" id="reg-password" placeholder="4자 이상" required minlength="4">
        </div>
        <button type="submit" class="btn btn-primary btn-full">회원가입</button>
        <p class="auth-note"><i class="ri-information-line"></i> 첫 번째 가입자는 관리자 권한을 받습니다.</p>
      </form>

      <div id="auth-error" class="error-msg" style="display:none"></div>
    </div>
  </div>

  <!-- 메인 대시보드 -->
  <div id="main-page" class="page" style="display:none">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <i class="ri-calendar-check-line"></i>
        <h1>휴무 취합</h1>
      </div>
      <div class="header-right">
        <span id="user-info" class="user-badge"></span>
        <button id="btn-logout" class="btn btn-ghost btn-sm">
          <i class="ri-logout-box-r-line"></i> 로그아웃
        </button>
      </div>
    </header>

    <!-- Week Navigation -->
    <div class="week-nav">
      <button id="btn-prev-week" class="btn btn-icon" title="이전 주">
        <i class="ri-arrow-left-s-line"></i>
      </button>
      <div class="week-info">
        <h2 id="week-title"></h2>
        <span id="week-dates" class="week-dates"></span>
        <span id="week-status" class="badge"></span>
      </div>
      <button id="btn-next-week" class="btn btn-icon" title="다음 주">
        <i class="ri-arrow-right-s-line"></i>
      </button>
    </div>

    <!-- Admin Controls -->
    <div id="admin-controls" class="admin-bar" style="display:none">
      <div class="admin-bar-left">
        <i class="ri-shield-star-line"></i>
        <span>관리자</span>
      </div>
      <div class="admin-bar-right">
        <button id="btn-toggle-week" class="btn btn-sm"></button>
        <button id="btn-export" class="btn btn-sm btn-outline">
          <i class="ri-file-excel-2-line"></i> 엑셀 다운로드
        </button>
        <button id="btn-members" class="btn btn-sm btn-ghost">
          <i class="ri-team-line"></i> 팀원 관리
        </button>
      </div>
    </div>

    <!-- Export button for non-admin -->
    <div id="member-controls" class="member-bar" style="display:none">
      <button id="btn-export-member" class="btn btn-sm btn-outline">
        <i class="ri-file-excel-2-line"></i> 엑셀 다운로드
      </button>
    </div>

    <!-- Calendar Grid -->
    <div class="calendar-section">
      <div class="calendar-grid" id="calendar-grid">
        <!-- Generated by JS -->
      </div>
    </div>

    <!-- Team Summary -->
    <div class="summary-section">
      <h3><i class="ri-team-line"></i> 팀 휴무 현황</h3>
      <div class="summary-table-wrapper">
        <table class="summary-table" id="summary-table">
          <thead>
            <tr id="summary-header">
              <!-- Generated by JS -->
            </tr>
          </thead>
          <tbody id="summary-body">
            <!-- Generated by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Fix Modal -->
  <div id="fix-modal" class="modal" style="display:none">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="ri-pushpin-line"></i> 픽스 휴무 설정</h3>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <p id="fix-date-label"></p>
        <div class="form-group">
          <label for="fix-reason">사유</label>
          <textarea id="fix-reason" placeholder="꼭 쉬어야 하는 사유를 입력하세요" rows="3"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="btn-fix-cancel">취소</button>
        <button class="btn btn-primary" id="btn-fix-confirm">픽스 확정</button>
      </div>
    </div>
  </div>

  <!-- Members Modal -->
  <div id="members-modal" class="modal" style="display:none">
    <div class="modal-content modal-wide">
      <div class="modal-header">
        <h3><i class="ri-team-line"></i> 팀원 관리</h3>
        <button class="modal-close" id="members-modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <table class="members-table">
          <thead>
            <tr>
              <th>이름</th>
              <th>아이디</th>
              <th>역할</th>
              <th>가입일</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="members-list">
            <!-- Generated by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" style="display:none"></div>

  <script src="/js/app.js"></script>
</body>
</html>
